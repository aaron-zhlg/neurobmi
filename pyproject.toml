[project]
name = "neurobmi"
version = "0.1.0"
description = "neurobmi — fMRI brain-region features and obesity / BMI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.10.0",
    # Multi-agent framework powering autoresearch/loop (lead + coder / linter / experimenter).
    "orchestra-agents",
]

[tool.uv.sources]
orchestra-agents = { git = "https://github.com/aaron-zhlg/orchestra", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurobmi", "autoresearch"]
