[project]
name = "neurobmi"
version = "0.1.0"
description = "neurobmi — brain-region features and obesity / BMI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "scipy>=1.14",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.10.0",
    # LLM client for autoresearch agents (DeepSeek's OpenAI-compatible API).
    "openai>=1.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurobmi", "autoresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
